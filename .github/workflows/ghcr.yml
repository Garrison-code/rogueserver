name: Publish container image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Garrison-code/rogueserver'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      # Build records are unnecessary artifacts for this image-only workflow.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_ID=${{ env.BUILD_ID }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.garrix.build-id=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}
          cache-to: type=gha,mode=min,scope=container-${{ github.ref_name }}

      - name: Verify published platforms
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -eu
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "Published image digest is empty"
            exit 1
          fi
          inspect="$(docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}")"
          printf '%s\n' "$inspect"
          case "$inspect" in
            *linux/amd64*) ;;
            *) echo "Missing platform: linux/amd64"; exit 1 ;;
          esac
          case "$inspect" in
            *linux/arm64*) ;;
            *) echo "Missing platform: linux/arm64"; exit 1 ;;
          esac

      - name: Summarize published image
        if: steps.build.outputs.digest != ''
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Published container image"
            echo
            echo 'Tags:'
            echo '~~~text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '~~~'
            echo
            printf 'Pinned image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
