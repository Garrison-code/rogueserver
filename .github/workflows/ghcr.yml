name: Publish container image

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.repository == 'Garrison-code/rogueserver' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Wait for required checks on this commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_notify.py quality

  publish:
    needs: quality
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    if: >-
      always() && github.repository == 'Garrison-code/rogueserver' &&
      (github.ref == 'refs/heads/master' ||
       (github.ref == 'refs/heads/develop' && needs.quality.result == 'success' && needs.quality.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      # Build records are unnecessary artifacts for this image-only workflow.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm develop is still current before publishing
        if: github.ref_name == 'develop'
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_notify.py quality

      - name: Build and push image
        if: github.ref_name != 'develop' || steps.current.outputs.eligible == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_ID=${{ env.BUILD_ID }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.garrix.build-id=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=container-${{ github.ref_name }}
          cache-to: type=gha,mode=min,scope=container-${{ github.ref_name }}

      - name: Summarize published image
        if: steps.build.outputs.digest != ''
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Published container image"
            echo
            echo 'Tags:'
            echo '~~~text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '~~~'
            echo
            printf 'Pinned image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  registry-ready:
    needs: publish
    if: >-
      github.ref == 'refs/heads/develop' &&
      needs.publish.result == 'success' && needs.publish.outputs.image_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm the published tag and build identity in GHCR
        id: registry
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_notify.py published

  notify-develop:
    needs: [publish, registry-ready]
    if: >-
      vars.DEV_AUTO_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/develop' &&
      needs.registry-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Notify the frontend coordinator after registry confirmation
        env:
          GH_TOKEN: ${{ secrets.DEV_DEPLOY_GH_TOKEN }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_notify.py notify

  registry-ready-production:
    needs: publish
    if: >-
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.publish.result == 'success' && needs.publish.outputs.image_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm the published tag and build identity in GHCR
        id: registry
        env:
          PROD_AUTO_DEPLOY_ENABLED: ${{ vars.PROD_AUTO_DEPLOY_ENABLED }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_production.py published

  notify-production:
    needs: [publish, registry-ready-production]
    if: >-
      always() &&
      vars.PROD_AUTO_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/master' &&
      needs.publish.result == 'success' &&
      needs.registry-ready-production.result == 'success' &&
      needs.registry-ready-production.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Notify the frontend coordinator after registry confirmation
        env:
          PROD_AUTO_DEPLOY_ENABLED: ${{ vars.PROD_AUTO_DEPLOY_ENABLED }}
          GH_TOKEN: ${{ secrets.PROD_DEPLOY_GH_TOKEN }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: python3 .github/scripts/publish_production.py notify
